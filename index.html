<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Marca tipográfica, não emoji: coerente com a identidade do B4. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%230a1116'/><text x='50' y='50' dy='.36em' text-anchor='middle' font-family='system-ui,sans-serif' font-size='52' font-weight='700' fill='%233ddc97'>V</text></svg>"
    />
    <!-- user-scalable=no removido: impedir zoom é uma barreira de acessibilidade. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#0a1116" />
    <meta
      name="description"
      content="VIDA — simulador de vida brasileiro. Pequenas escolhas, grandes histórias."
    />
    <title>VIDA — Simulador de Vida</title>

    <!--
      Fontes remotas são um reforço, não um requisito: `media=print onload`
      as carrega sem bloquear a renderização, e a pilha local definida em
      tokens.css mantém o produto legível e bonito se elas falharem.
    -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
      />
    </noscript>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
