<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <!-- Marca tipográfica, não emoji: coerente com a identidade do B4. -->
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='22' fill='%23121010'/><text x='50' y='50' dy='.36em' text-anchor='middle' font-family='system-ui,sans-serif' font-size='52' font-weight='700' fill='%23d9a05b'>V</text></svg>"
    />
    <!-- user-scalable=no removido: impedir zoom é uma barreira de acessibilidade. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#121010" />
    <meta
      name="description"
      content="VIDA — um simulador de vida, nascido no Brasil e aberto ao mundo. Pequenas escolhas, grandes histórias."
    />
    <title>VIDA — Simulador de Vida</title>

    <!--
      PWA: o manifesto (manifest.webmanifest) é gerado e ligado aqui pelo
      vite-plugin-pwa no build. Ícones em public/icones/ (gerados por
      scripts/pwa/gerarIcones.mjs a partir da marca acima). O iOS não lê os
      ícones do manifesto: precisa do apple-touch-icon e das metas abaixo.
    -->
    <link rel="apple-touch-icon" href="icones/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="VIDA" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <!--
      Duas famílias, dois papéis:

      · Newsreader (serifa) carrega TODA a voz narrativa — Linha da Vida,
        acontecimentos, nomes. É a fonte que faz o VIDA parecer uma página
        e não um painel. Fonte variável, com tamanho óptico e itálico.
      · Inter carrega só a mobília de interface: rótulos, botões, números.
        Quanto mais invisível, melhor — a identidade é da serifa.

      PWA: as duas vêm do próprio jogo (src/ui/fontes.css, pacotes
      @fontsource-variable, licença OFL) e entram no precache — nada de
      Google Fonts, o jogo abre igual offline. As pilhas locais de tokens.css
      (Georgia/Charter para a serifa) seguem como reserva.
    -->
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
